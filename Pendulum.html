<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pendulum</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5ea;
            padding: 14px 24px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header p {
            font-size: 12px;
            color: #86868b;
            margin-top: 2px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-areas:
                "pendulum graph"
                "action action"
                "variables variables";
            gap: 6px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 12px;
            flex: 1;
        }

        .pendulum-card { grid-area: pendulum; }
        .graph-card { grid-area: graph; }
        .action-bar { grid-area: action; }
        .variables-panel { grid-area: variables; }

        @media (max-width: 899px) {
            .container {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 12px;
                min-height: calc(100dvh - 60px);
            }
            .pendulum-card { order: 1; }
            .action-bar { order: 2; }
            .graph-card { order: 3; }
            .variables-panel { order: 4; }

            #pendulum-canvas {
                height: 380px;
            }

            #graph-canvas {
                height: 320px;
            }
        }

        /* Card Styles */
        .canvas-card, .variables-panel, .action-bar {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            padding: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #86868b;
        }

        .canvas-container {
            width: 100%;
            background: #1c1c1e;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #pendulum-canvas {
            height: 300px;
            width: 100%;
            display: block;
            cursor: grab;
        }

        #pendulum-canvas:active {
            cursor: grabbing;
        }

        #graph-canvas {
            height: 300px;
            width: 100%;
            display: block;
        }

        .tab-buttons {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #e5e5ea;
            background: #f2f2f7;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #0066cc;
            color: #ffffff;
            border-color: #0066cc;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 12px 20px;
        }

        .btn {
            padding: 8px 24px;
            border-radius: 6px;
            border: 1px solid #d1d1d6;
            background: #f2f2f7;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: #0066cc;
            color: #ffffff;
            border-color: #0066cc;
        }

        .reset-btn {
            background: none;
            border: 1px solid #d1d1d6;
            color: #0066cc;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        /* Variables Grid */
        .variables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 6px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #3a3a3c;
        }

        .input-value {
            font-family: monospace;
            color: #636366;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #0066cc;
            cursor: pointer;
        }

        .preset-buttons {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .preset-btn {
            flex: 1;
            padding: 4px 6px;
            font-size: 10px;
            border: 1px solid #e5e5ea;
            background: #f9f9fb;
            border-radius: 4px;
            cursor: pointer;
        }

        .readouts {
            background: #f9f9fb;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }

        .readout-row {
            display: flex;
            justify-content: space-between;
            color: #636366;
        }

        .readout-val {
            font-weight: 600;
            color: #1d1d1f;
        }
    </style>
</head>
<body>

    <header>
        <h1>Simple Pendulum</h1>
    </header>

    <main class="container">

        <!-- Pendulum Visual Plane -->
        <section class="canvas-card pendulum-card">
            <div class="card-header">
                <span class="card-title">Pendulum Plane</span>
                <span style="font-size: 11px; color: #86868b;">Drag bob to set angle</span>
            </div>
            <div class="canvas-container">
                <canvas id="pendulum-canvas"></canvas>
            </div>
        </section>

        <!-- Action Control Buttons -->
        <section class="action-bar">
            <button id="play-btn" class="btn btn-primary">Pause</button>
            <button id="step-btn" class="btn">Step</button>
            <button id="reset-btn" class="reset-btn">Reset Variables</button>
        </section>

        <!-- Dynamic Graph Plane -->
        <section class="canvas-card graph-card">
            <div class="card-header">
                <span class="card-title">Oscillogram</span>
                <div class="tab-buttons">
                    <button id="tab-angle" class="tab-btn active">Angle vs Time</button>
                    <button id="tab-energy" class="tab-btn">Energy Decomposition</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="graph-canvas"></canvas>
            </div>
        </section>

        <!-- Variables Controls & Readouts -->
        <section class="variables-panel">
            <div class="card-header">
                <span class="card-title">Variables & Analytics</span>
            </div>
            <div class="variables-grid">
                <div>
                    <div class="input-group">
                        <div class="input-label">
                            <span>Length (L)</span>
                            <span id="len-val" class="input-value">1.50 m</span>
                        </div>
                        <input type="range" id="len-slider" min="0.2" max="3.0" step="0.05" value="1.50">
                    </div>

                    <div class="input-group">
                        <div class="input-label">
                            <span>Gravity (g)</span>
                            <span id="grav-val" class="input-value">9.81 m/s²</span>
                        </div>
                        <input type="range" id="grav-slider" min="1.0" max="25.0" step="0.1" value="9.81">
                        <div class="preset-buttons">
                            <button class="preset-btn" data-g="1.62">Moon</button>
                            <button class="preset-btn" data-g="3.71">Mars</button>
                            <button class="preset-btn" data-g="9.81">Earth</button>
                            <button class="preset-btn" data-g="24.79">Jupiter</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="input-group">
                        <div class="input-label">
                            <span>Bob Mass (m)</span>
                            <span id="mass-val" class="input-value">1.00 kg</span>
                        </div>
                        <input type="range" id="mass-slider" min="0.1" max="5.0" step="0.1" value="1.0">
                    </div>

                    <div class="input-group">
                        <div class="input-label">
                            <span>Initial Angle (θ₀)</span>
                            <span id="angle-val" class="input-value">30°</span>
                        </div>
                        <input type="range" id="angle-slider" min="-90" max="90" step="1" value="30">
                    </div>

                    <div class="input-group">
                        <div class="input-label">
                            <span>Damping Friction (b)</span>
                            <span id="damp-val" class="input-value">0.05</span>
                        </div>
                        <input type="range" id="damp-slider" min="0.00" max="0.50" step="0.01" value="0.05">
                    </div>
                </div>

                <div class="readouts">
                    <div class="readout-row">
                        <span>Period (T₀):</span>
                        <span id="readout-period" class="readout-val">2.46 s</span>
                    </div>
                    <div class="readout-row">
                        <span>Current Angle (θ):</span>
                        <span id="readout-angle" class="readout-val">0.0°</span>
                    </div>
                    <div class="readout-row">
                        <span>Angular Velocity (ω):</span>
                        <span id="readout-omega" class="readout-val">0.00 rad/s</span>
                    </div>
                    <div class="readout-row">
                        <span>Total Energy (E):</span>
                        <span id="readout-energy" class="readout-val">0.00 J</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const pCanvas = document.getElementById('pendulum-canvas');
        const gCanvas = document.getElementById('graph-canvas');
        const pCtx = pCanvas.getContext('2d');
        const gCtx = gCanvas.getContext('2d');

        const inputs = {
            length: document.getElementById('len-slider'),
            gravity: document.getElementById('grav-slider'),
            mass: document.getElementById('mass-slider'),
            angle: document.getElementById('angle-slider'),
            damping: document.getElementById('damp-slider')
        };

        const readouts = {
            length: document.getElementById('len-val'),
            gravity: document.getElementById('grav-val'),
            mass: document.getElementById('mass-val'),
            angle: document.getElementById('angle-val'),
            damping: document.getElementById('damp-val'),
            period: document.getElementById('readout-period'),
            calcAngle: document.getElementById('readout-angle'),
            omega: document.getElementById('readout-omega'),
            energy: document.getElementById('readout-energy')
        };

        const playBtn = document.getElementById('play-btn');
        const stepBtn = document.getElementById('step-btn');
        const resetBtn = document.getElementById('reset-btn');
        const tabAngle = document.getElementById('tab-angle');
        const tabEnergy = document.getElementById('tab-energy');

        let length = parseFloat(inputs.length.value);
        let gravity = parseFloat(inputs.gravity.value);
        let mass = parseFloat(inputs.mass.value);
        let theta = (parseFloat(inputs.angle.value) * Math.PI) / 180;
        let omega = 0;
        let alpha = 0;
        let damping = parseFloat(inputs.damping.value);

        let isRunning = true;
        let isDragging = false;
        let graphMode = 'angle';
        let history = [];
        const maxHistory = 350;

        function resizeCanvases() {
            [pCanvas, gCanvas].forEach(c => {
                const rect = c.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
            });
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function updatePhysics(dt) {
            if (!isRunning || isDragging) return;

            const steps = 10;
            const subDt = dt / steps;

            for (let i = 0; i < steps; i++) {
                alpha = -(gravity / length) * Math.sin(theta) - (damping / (mass * length)) * omega;
                omega += alpha * subDt;
                theta += omega * subDt;
            }

            const v = length * omega;
            const ke = 0.5 * mass * v * v;
            const pe = mass * gravity * length * (1 - Math.cos(theta));
            const totalE = ke + pe;

            history.push({ theta, ke, pe, totalE });
            if (history.length > maxHistory) history.shift();
        }

        function drawPendulum() {
            const dpr = window.devicePixelRatio || 1;
            const w = pCanvas.width;
            const h = pCanvas.height;

            pCtx.clearRect(0, 0, w, h);

            const pivotX = w / 2;
            const pivotY = h * 0.12;
            const pxPerMeter = Math.min(w, h) * 0.26;
            const rodLen = length * pxPerMeter;

            const bobX = pivotX + rodLen * Math.sin(theta);
            const bobY = pivotY + rodLen * Math.cos(theta);

            // Ceiling Mount
            pCtx.strokeStyle = '#636366';
            pCtx.lineWidth = 2 * dpr;
            pCtx.beginPath();
            pCtx.moveTo(pivotX - 25 * dpr, pivotY);
            pCtx.lineTo(pivotX + 25 * dpr, pivotY);
            pCtx.stroke();

            // Axis reference
            pCtx.setLineDash([3 * dpr, 3 * dpr]);
            pCtx.strokeStyle = '#48484a';
            pCtx.beginPath();
            pCtx.moveTo(pivotX, pivotY);
            pCtx.lineTo(pivotX, pivotY + rodLen + 15 * dpr);
            pCtx.stroke();
            pCtx.setLineDash([]);

            // Rod
            pCtx.strokeStyle = '#aeae82';
            pCtx.lineWidth = 2 * dpr;
            pCtx.beginPath();
            pCtx.moveTo(pivotX, pivotY);
            pCtx.lineTo(bobX, bobY);
            pCtx.stroke();

            // Angle indicator
            pCtx.strokeStyle = '#0a84ff';
            pCtx.lineWidth = 1.5 * dpr;
            pCtx.beginPath();
            const arcRadius = 35 * dpr;
            const startA = Math.PI / 2;
            const endA = Math.PI / 2 - theta;
            pCtx.arc(pivotX, pivotY, arcRadius, Math.min(startA, endA), Math.max(startA, endA));
            pCtx.stroke();

            // Angle text
            pCtx.fillStyle = '#0a84ff';
            pCtx.font = `${11 * dpr}px sans-serif`;
            const deg = ((theta * 180) / Math.PI).toFixed(1);
            pCtx.fillText(`${deg}°`, pivotX + (theta >= 0 ? 10 : -30) * dpr, pivotY + arcRadius + 14 * dpr);

            // Bob
            const radius = (8 + mass * 3) * dpr;
            pCtx.fillStyle = isDragging ? '#30d158' : '#0a84ff';
            pCtx.beginPath();
            pCtx.arc(bobX, bobY, radius, 0, Math.PI * 2);
            pCtx.fill();
        }

        function drawGraph() {
            const dpr = window.devicePixelRatio || 1;
            const w = gCanvas.width;
            const h = gCanvas.height;

            gCtx.clearRect(0, 0, w, h);

            // Vertical time grid lines
            gCtx.strokeStyle = '#2c2c2e';
            gCtx.lineWidth = 1 * dpr;
            gCtx.setLineDash([2 * dpr, 4 * dpr]);
            for (let i = 1; i <= 3; i++) {
                const x = (w / 4) * i;
                gCtx.beginPath();
                gCtx.moveTo(x, 0);
                gCtx.lineTo(x, h);
                gCtx.stroke();
            }
            gCtx.setLineDash([]);

            if (graphMode === 'angle') {
                const midY = h / 2;
                const scaleY = h * 0.38;

                // Horizontal grid lines and angle labels
                const levels = [
                    { y: midY - scaleY, label: '+90°' },
                    { y: midY - scaleY * 0.5, label: '+45°' },
                    { y: midY, label: '0°' },
                    { y: midY + scaleY * 0.5, label: '-45°' },
                    { y: midY + scaleY, label: '-90°' }
                ];

                gCtx.font = `${9 * dpr}px sans-serif`;
                gCtx.fillStyle = '#86868b';

                levels.forEach(level => {
                    gCtx.strokeStyle = level.label === '0°' ? '#48484a' : '#2c2c2e';
                    gCtx.beginPath();
                    gCtx.moveTo(0, level.y);
                    gCtx.lineTo(w, level.y);
                    gCtx.stroke();

                    gCtx.fillText(level.label, w - 30 * dpr, level.y - 3 * dpr);
                });

                if (history.length < 2) return;

                const stepX = w / maxHistory;

                gCtx.strokeStyle = '#0a84ff';
                gCtx.lineWidth = 2 * dpr;
                gCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = i * stepX;
                    const y = midY - (history[i].theta / (Math.PI / 2)) * scaleY;
                    if (i === 0) gCtx.moveTo(x, y);
                    else gCtx.lineTo(x, y);
                }
                gCtx.stroke();

                gCtx.fillStyle = '#0a84ff';
                gCtx.font = `${10 * dpr}px sans-serif`;
                gCtx.fillText('Angle θ (rad/deg)', 10 * dpr, 15 * dpr);

            } else {
                const maxE = Math.max(0.1, ...history.map(d => d.totalE * 1.2));
                const bottomY = h - 12 * dpr;
                const graphH = h - 30 * dpr;

                // Horizontal energy grid lines & energy values
                const eLevels = [
                    { val: maxE, y: bottomY - graphH },
                    { val: maxE * 0.5, y: bottomY - graphH * 0.5 },
                    { val: 0, y: bottomY }
                ];

                gCtx.font = `${9 * dpr}px sans-serif`;
                gCtx.fillStyle = '#86868b';

                eLevels.forEach(level => {
                    gCtx.strokeStyle = '#2c2c2e';
                    gCtx.beginPath();
                    gCtx.moveTo(0, level.y);
                    gCtx.lineTo(w, level.y);
                    gCtx.stroke();

                    gCtx.fillText(`${level.val.toFixed(1)}J`, w - 30 * dpr, level.y - 3 * dpr);
                });

                if (history.length < 2) return;

                const stepX = w / maxHistory;

                // Kinetic (Green)
                gCtx.strokeStyle = '#30d158';
                gCtx.lineWidth = 1.5 * dpr;
                gCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = i * stepX;
                    const y = bottomY - (history[i].ke / maxE) * graphH;
                    if (i === 0) gCtx.moveTo(x, y);
                    else gCtx.lineTo(x, y);
                }
                gCtx.stroke();

                // Potential (Yellow)
                gCtx.strokeStyle = '#ffd60a';
                gCtx.lineWidth = 1.5 * dpr;
                gCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = i * stepX;
                    const y = bottomY - (history[i].pe / maxE) * graphH;
                    if (i === 0) gCtx.moveTo(x, y);
                    else gCtx.lineTo(x, y);
                }
                gCtx.stroke();

                // Total (Blue)
                gCtx.strokeStyle = '#64d2ff';
                gCtx.lineWidth = 2 * dpr;
                gCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = i * stepX;
                    const y = bottomY - (history[i].totalE / maxE) * graphH;
                    if (i === 0) gCtx.moveTo(x, y);
                    else gCtx.lineTo(x, y);
                }
                gCtx.stroke();

                gCtx.font = `${10 * dpr}px sans-serif`;
                gCtx.fillStyle = '#30d158';
                gCtx.fillText('Kinetic (K)', 10 * dpr, 15 * dpr);
                gCtx.fillStyle = '#ffd60a';
                gCtx.fillText('Potential (U)', 80 * dpr, 15 * dpr);
                gCtx.fillStyle = '#64d2ff';
                gCtx.fillText('Total (E)', 160 * dpr, 15 * dpr);
            }
        }

        function updateReadouts() {
            readouts.length.textContent = `${length.toFixed(2)} m`;
            readouts.gravity.textContent = `${gravity.toFixed(2)} m/s²`;
            readouts.mass.textContent = `${mass.toFixed(2)} kg`;
            readouts.angle.textContent = `${((theta * 180) / Math.PI).toFixed(0)}°`;
            readouts.damping.textContent = damping.toFixed(2);

            const period = 2 * Math.PI * Math.sqrt(length / gravity);
            readouts.period.textContent = `${period.toFixed(2)} s`;
            readouts.calcAngle.textContent = `${((theta * 180) / Math.PI).toFixed(1)}°`;
            readouts.omega.textContent = `${omega.toFixed(2)} rad/s`;

            const v = length * omega;
            const ke = 0.5 * mass * v * v;
            const pe = mass * gravity * length * (1 - Math.cos(theta));
            readouts.energy.textContent = `${(ke + pe).toFixed(2)} J`;
        }

        inputs.length.addEventListener('input', e => { length = parseFloat(e.target.value); updateReadouts(); });
        inputs.gravity.addEventListener('input', e => { gravity = parseFloat(e.target.value); updateReadouts(); });
        inputs.mass.addEventListener('input', e => { mass = parseFloat(e.target.value); updateReadouts(); });
        inputs.angle.addEventListener('input', e => {
            theta = (parseFloat(e.target.value) * Math.PI) / 180;
            omega = 0;
            history = [];
            updateReadouts();
        });
        inputs.damping.addEventListener('input', e => { damping = parseFloat(e.target.value); updateReadouts(); });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const gVal = parseFloat(btn.dataset.g);
                inputs.gravity.value = gVal;
                gravity = gVal;
                updateReadouts();
            });
        });

        playBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            playBtn.textContent = isRunning ? 'Pause' : 'Play';
        });

        stepBtn.addEventListener('click', () => {
            isRunning = false;
            playBtn.textContent = 'Play';
            updatePhysics(0.016);
            updateReadouts();
            drawPendulum();
            drawGraph();
        });

        resetBtn.addEventListener('click', () => {
            inputs.length.value = 1.5;
            inputs.gravity.value = 9.81;
            inputs.mass.value = 1.0;
            inputs.angle.value = 30;
            inputs.damping.value = 0.05;

            length = 1.5;
            gravity = 9.81;
            mass = 1.0;
            theta = (30 * Math.PI) / 180;
            omega = 0;
            damping = 0.05;
            history = [];
            updateReadouts();
        });

        tabAngle.addEventListener('click', () => {
            graphMode = 'angle';
            tabAngle.classList.add('active');
            tabEnergy.classList.remove('active');
        });

        tabEnergy.addEventListener('click', () => {
            graphMode = 'energy';
            tabEnergy.classList.add('active');
            tabAngle.classList.remove('active');
        });

        // Interactive Dragging on Bob
        function handlePointerDown(e) {
            const rect = pCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const clickX = (e.clientX - rect.left) * dpr;
            const clickY = (e.clientY - rect.top) * dpr;

            const pivotX = pCanvas.width / 2;
            const pivotY = pCanvas.height * 0.12;
            const pxPerMeter = Math.min(pCanvas.width, pCanvas.height) * 0.26;
            const rodLen = length * pxPerMeter;

            const bobX = pivotX + rodLen * Math.sin(theta);
            const bobY = pivotY + rodLen * Math.cos(theta);

            if (Math.hypot(clickX - bobX, clickY - bobY) < 30 * dpr) {
                isDragging = true;
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            const rect = pCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const mouseX = (e.clientX - rect.left) * dpr;
            const mouseY = (e.clientY - rect.top) * dpr;

            const pivotX = pCanvas.width / 2;
            const pivotY = pCanvas.height * 0.12;

            theta = Math.atan2(mouseX - pivotX, mouseY - pivotY);
            omega = 0;
            inputs.angle.value = ((theta * 180) / Math.PI).toFixed(0);
            updateReadouts();
        }

        function handlePointerUp() {
            if (isDragging) {
                isDragging = false;
                omega = 0;
            }
        }

        pCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        pCanvas.addEventListener('touchstart', e => handlePointerDown(e.touches[0]));
        window.addEventListener('touchmove', e => handlePointerMove(e.touches[0]));
        window.addEventListener('touchend', handlePointerUp);

        let lastTime = performance.now();
        function animate(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            updatePhysics(dt);
            updateReadouts();
            drawPendulum();
            drawGraph();

            requestAnimationFrame(animate);
        }

        updateReadouts();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
